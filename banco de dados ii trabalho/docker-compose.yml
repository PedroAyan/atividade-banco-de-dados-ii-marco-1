services:
  postgres:
    image: postgres:17
    container_name: sistema-matricula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matricula_academica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: